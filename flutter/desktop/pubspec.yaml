name: ees_ams
description: AttendEase - Attendance Management System migrated from React/Tauri to Flutter
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.5.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # HTTP & API
  dio: ^5.4.0
  json_annotation: ^4.9.0

  # Local Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # UI Components
  cupertino_icons: ^1.0.8
  material_symbols_icons: ^4.2722.0
  google_fonts: ^6.2.1

  # Authentication
  google_sign_in: ^6.2.1

  # Forms & Validation
  reactive_forms: ^17.0.1

  # File Handling
  file_picker: ^8.1.6
  excel: ^4.0.4
  path_provider: ^2.1.5

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.5
  uuid: ^4.5.1
  logger: ^2.4.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.2
  connectivity_plus: ^6.1.0
  
  # Dependency Injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Desktop specific
  window_manager: ^0.4.2
  desktop_drop: ^0.5.0
  googleapis: ^16.0.0
  googleapis_auth: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code Generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0
  injectable_generator: ^2.5.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/

flutter_intl:
  enabled: true
  main_locale: en_US
  output_dir: lib/l10n
  output_localization_file: app_localizations.dart
  class_name: AppLocalizations
  arb_dir: lib/l10n/arb

msix_config:
  display_name: AttendEase
  publisher_display_name: EES Solutions
  identity_name: com.ees.attendease
  publisher: CN=EES Solutions
  capabilities: 'internetClient, location, microphone'
  languages: en-US