version: 2.1

jobs:
  frontend-check:
    docker:
      - image: oven/bun:1.3.13
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - bun-v1-{{ arch }}-{{ checksum "bun.lock" }}
            - bun-v1-{{ arch }}-
      - run:
          name: Install frontend dependencies
          command: bun install --frozen-lockfile
      - save_cache:
          key: bun-v1-{{ arch }}-{{ checksum "bun.lock" }}
          paths:
            - ~/.bun/install/cache
      - run:
          name: Check Svelte project
          command: bun run check
      - run:
          name: Lint frontend
          command: bun run lint
      - run:
          name: Type-check frontend
          command: bun run typecheck
      - run:
          name: Build frontend
          command: bun run build
      - run:
          name: Create the ~/artifacts directory if it doesn't exist
          command: mkdir -p ~/artifacts
      - run:
          name: Copy artifacts
          command: cp -R build ~/artifacts 2>/dev/null || true
      - store_artifacts:
          path: ~/artifacts
          destination: node-build

  backend-check:
    docker:
      - image: cimg/rust:1.88.0
    working_directory: ~/project/src-tauri
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Skip backend checks outside pull requests
          command: |
            if [ -z "${CIRCLE_PULL_REQUEST:-}" ]; then
              echo "Backend checks run only for pull request pipelines."
              circleci-agent step halt
            fi
      - restore_cache:
          keys:
            - cargo-v1-{{ arch }}-{{ checksum "Cargo.lock" }}
            - cargo-v1-{{ arch }}-
      - run:
          name: Install Tauri Linux dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y \
              libwebkit2gtk-4.1-dev \
              libgtk-3-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              patchelf
      - run:
          name: Install Rust lint components
          command: rustup component add rustfmt clippy
      - run:
          name: Check Rust formatting
          command: cargo fmt -- --check
      - run:
          name: Run Clippy
          command: cargo clippy
      - run:
          name: Check Rust project
          command: cargo check
      - save_cache:
          key: cargo-v1-{{ arch }}-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - target

workflows:
  ci:
    jobs:
      - frontend-check
      - backend-check:
          filters:
            branches:
              ignore:
                - main
                - master
