name: Backend CI

on:
  pull_request:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'app-v*'

jobs:
  backend-check:
    name: Backend Check
    # Windows, because that is the only platform this app builds or ships: the
    # SF2 layer is Excel COM, which does not exist on Linux. Checking on ubuntu
    # compiled against a different set of `cfg` branches than the one that runs.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check Rust formatting
        run: cargo fmt -- --check

      - name: Lint Rust
        run: cargo clippy -- -D warnings

      - name: Check Rust project
        run: cargo check
