name: Code Review Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]

jobs:
  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          
      - name: Install dependencies
        run: bun install
        working-directory: ./src
        
      - name: Type check
        run: bun exec tsc --noEmit
        working-directory: ./src
        
      - name: Lint code
        run: bun run lint
        working-directory: ./src
        
      - name: Check formatting
        run: bun run format:check
        working-directory: ./src
        
      - name: Run tests
        run: bun run test
        working-directory: ./src
        
      - name: Build frontend
        run: bun run build
        working-directory: ./src

  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          
      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
            
      - name: Install dependencies
        run: cargo fetch
        working-directory: ./src-tauri
        
      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: ./src-tauri
        
      - name: Lint with Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: ./src-tauri
        
      - name: Run tests
        run: cargo test --all-features
        working-directory: ./src-tauri
        
      - name: Build backend
        run: cargo build --release
        working-directory: ./src-tauri

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Rust security audit
        uses: actions-rs/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v1
        with:
          command: check
          arguments: --manifest-path src-tauri/Cargo.toml
          
      - name: Run npm audit
        run: bun audit
        working-directory: ./src

  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
        
      - name: Install dependencies
        run: |
          bun install
          cargo fetch
        working-directory: ./src
        
      - name: Generate Rust coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
        working-directory: ./src-tauri
        
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: lcov.info
          fail_ci_if_error: true

  pr-size-check:
    name: PR Size Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v40
        with:
          files: |
            **/*.rs
            **/*.ts
            **/*.tsx
            
      - name: Check PR size
        run: |
          CHANGES=${{ steps.changed-files.outputs.all_changed_files_count }}
          if [ $CHANGES -gt 500 ]; then
            echo "::error::This PR is too large ($CHANGES files changed). Please consider breaking it into smaller PRs."
            exit 1
          elif [ $CHANGES -gt 200 ]; then
            echo "::warning::This PR is quite large ($CHANGES files changed). Consider breaking it into smaller PRs if possible."
          fi

  require-approval:
    name: Require Approval
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Require at least 2 approvals for merging
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const approvals = reviews.filter(review => review.state === 'APPROVED');
            if (approvals.length < 2) {
              core.setFailed('This PR requires at least 2 approvals before it can be merged');
            }

  check-milestone:
    name: Check Milestone
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Check if milestone is set
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr.milestone) {
              core.warning('Consider adding a milestone to this PR to track its release');
            }

  check-issue-links:
    name: Check Issue Links
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Check if PR references an issue
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prBody = context.payload.pull_request.body || '';
            const hasIssueReference = /#\d+/.test(prBody) || /closes #\d+/i.test(prBody);
            
            if (!hasIssueReference && !prBody.includes('NO-ISSUE')) {
              core.warning('Consider linking this PR to an issue using "Fixes #<number>" or "Closes #<number>"');
            }