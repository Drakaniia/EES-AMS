<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>EES Attendance</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
  </defs>
  <!-- Rounded square badge -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#bg)"/>
  <!-- Stylized "E" monogram -->
  <g fill="#FFF" transform="translate(64,58)">
    <!-- Vertical stem -->
    <rect x="-32" y="-38" width="18" height="76" rx="4"/>
    <!-- Top horizontal -->
    <rect x="-32" y="-38" width="64" height="16" rx="4"/>
    <!-- Middle horizontal (shorter, offset right) -->
    <rect x="-32" y="-10" width="50" height="16" rx="4"/>
    <!-- Bottom horizontal -->
    <rect x="-32" y="22" width="64" height="16" rx="4"/>
  </g>
  <!-- Checkmark accent — attendance motif -->
  <g transform="translate(92,94)" fill="none" stroke="#FFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="-20,-10 -6,8 20,-16"/>
  </g>
</svg>
