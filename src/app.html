<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Loading screen overlay - shows immediately on app launch -->
		<div
			id="initial-loading"
			style="
				position: fixed;
				inset: 0;
				background-color: var(--color-background);
				z-index: 9999;
				display: flex;
				align-items: center;
				justify-content: center;
			"
		>
			<div style="display: flex; flex-direction: column; gap: 10px; align-items: center">
				<div
					style="
						width: 112px;
						height: 8px;
						border: 1px solid rgba(251, 146, 60, 0.35);
						background-color: rgba(251, 146, 60, 0.08);
						border-radius: 999px;
						overflow: hidden;
					"
				>
					<div
						style="width: 40%; height: 100%; background-color: #fb923c; border-radius: 999px"
					></div>
				</div>
				<div
					style="
						font:
							12px system-ui,
							sans-serif;
						color: #78716c;
					"
				>
					Loading
				</div>
			</div>
		</div>

		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
