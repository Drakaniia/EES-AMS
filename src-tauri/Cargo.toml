[package]
name = "app"
version = "0.5.2"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.88.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

# Zero hand-written Rust (spec D1): `src/lib.rs` registers plugins and does nothing
# else. Every dependency below is either Tauri itself or an official plugin the
# TypeScript backend imports from `@tauri-apps/plugin-*`.
[dependencies]
# `log`: `tauri_plugin_log::Builder::level` takes a `log::LevelFilter`.
# `serde_json`: `tauri::generate_context!` expands to code that deserializes the
#   config and capability files, so the macro fails to compile without it. Plain
#   `serde` is not needed: nothing in `src/` derives or implements a trait.
log = "0.4"
serde_json = "1.0"
# `~` (not `^`) on every crate whose npm counterpart is installed: the Tauri CLI
# refuses to build on a major.minor mismatch, so a floating requirement lets a
# routine `cargo update` break `tauri build`.
tauri = { version = "~2.12", features = [] }
tauri-plugin-dialog = "~2.8"
tauri-plugin-fs = "~2.6"
tauri-plugin-log = "2"
tauri-plugin-opener = "~2.7"
tauri-plugin-updater = "~2.13"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 3  # Optimize dependencies in dev
